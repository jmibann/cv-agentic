<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Valor de --palette-light-bg (tokens.css); el anti-flash lo ajusta
         según el tema resuelto. Único exceptuado de la regla dura 1 de
         docs/DESIGN.md, fijado por test (src/test/anti-flash.test.ts). -->
    <meta name="theme-color" content="#eceef4" />
    <title>Juan Manuel Ibáñez · Frontend Engineer</title>
    <!-- #117 (T19, RF-11): metadatos de compartir. Los valores literales los
         fija la tabla "Metadatos de compartir" de specs/foundation/Foundation/
         spec.md y los verifica src/test/anti-flash.test.ts: no se editan. Van
         después del <title> y antes del anti-flash (plan #117, decisión 1):
         una etiqueta meta no es un link ni un script con src, el contrato T4
         (anti-flash.test.ts) no se viola. -->
    <meta name="description" content="Frontend Engineer with 7+ years in React and TypeScript: design systems, accessibility and AI-assisted development." />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Juan Manuel Ibáñez · Frontend Engineer" />
    <meta property="og:description" content="React · TypeScript · Design Systems · Accessibility" />
    <meta property="og:url" content="https://jmibann.github.io/cv-agentic/" />
    <meta property="og:image" content="https://jmibann.github.io/cv-agentic/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
<script>
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem("cv:theme");
      if (t !== "light" && t !== "dark") {
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      d.dataset.theme = t;
      // theme-color inicial: tokens.css todavía no cargó, así que van los
      // valores de --palette-light-bg / --palette-dark-bg (un test verifica
      // que coincidan con tokens.css; ver regla dura 1 de docs/DESIGN.md)
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "dark" ? "#151517" : "#eceef4");
      var l = localStorage.getItem("cv:locale");
      if (l !== "en" && l !== "es") {
        var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
        l = /^es\b/i.test(n) ? "es" : "en";
      }
      d.lang = l;
    } catch (e) {
      d.dataset.theme = "light";
      d.lang = "en";
    }
  })();
</script>
    <!-- D4 (hallazgo F5, T13): favicon SVG para evitar el 404 de /favicon.ico.
         Va después del anti-flash porque el contrato de T4 (verificado por
         src/test/anti-flash.test.ts) no admite ningún <link> antes del script. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- #115 (T14): mismo ícono a 180×180 para "Agregar a pantalla de inicio". -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- #117 (T19, RF-13): canonical y JSON-LD van después del anti-flash y
         del bloque de íconos, al final del head. El contrato del JSON-LD es
         el objeto parseado (RF-12, seis claves exactas); el formato del
         bloque en el HTML no lo es. La imagen la sirve /og-image.png (RF-14,
         PNG 1200×630 en public/); las URLs son absolutas al deploy de GitHub
         Pages: Vite no las reescribe en este archivo. -->
    <link rel="canonical" href="https://jmibann.github.io/cv-agentic/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Juan Manuel Ibáñez",
        "jobTitle": "Frontend Engineer",
        "url": "https://jmibann.github.io/cv-agentic/",
        "sameAs": [
          "https://github.com/jmibann",
          "https://www.linkedin.com/in/juanmanuelibanez"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
