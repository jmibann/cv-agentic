<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Value of --palette-light-bg in tokens.css; the anti-flash script
         below adjusts it to the resolved theme. It is the one color literal
         allowed outside tokens.css, and a test keeps the two in sync. -->
    <meta name="theme-color" content="#eceef4" />
    <title>Juan Manuel Ibáñez · Frontend Engineer</title>
    <!-- Sharing metadata. The literal values are fixed and checked by a
         test: do not edit them. They may sit before the anti-flash script
         because a meta tag is neither a link element nor an external
         script, which are the only things that must not precede it. -->
    <meta name="description" content="Frontend Engineer with 7+ years in React and TypeScript: design systems, accessibility and AI-assisted development." />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Juan Manuel Ibáñez · Frontend Engineer" />
    <meta property="og:description" content="React · TypeScript · Design Systems · Accessibility" />
    <meta property="og:url" content="https://jmibann.github.io/cv-agentic/" />
    <meta property="og:image" content="https://jmibann.github.io/cv-agentic/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
<script>
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem("cv:theme");
      if (t !== "light" && t !== "dark") {
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      d.dataset.theme = t;
      // Initial theme-color: tokens.css has not loaded yet, so these are the
      // values of --palette-light-bg / --palette-dark-bg (a test checks that
      // they match tokens.css)
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "dark" ? "#151517" : "#eceef4");
      var l = localStorage.getItem("cv:locale");
      if (l !== "en" && l !== "es") {
        var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
        l = /^es\b/i.test(n) ? "es" : "en";
      }
      d.lang = l;
    } catch (e) {
      d.dataset.theme = "light";
      d.lang = "en";
    }
  })();
</script>
    <!-- SVG favicon, so the browser does not request /favicon.ico and get a
         404. It comes after the anti-flash script: no link element may
         precede that script (a test enforces it). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The same icon at 180×180 for "Add to Home Screen". -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Canonical and JSON-LD go last in the head, after the anti-flash
         script. The URLs are absolute to the GitHub Pages deploy because
         Vite does not rewrite them in this file. -->
    <link rel="canonical" href="https://jmibann.github.io/cv-agentic/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Juan Manuel Ibáñez",
        "jobTitle": "Frontend Engineer",
        "url": "https://jmibann.github.io/cv-agentic/",
        "sameAs": [
          "https://github.com/jmibann",
          "https://www.linkedin.com/in/juanmanuelibanez"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
